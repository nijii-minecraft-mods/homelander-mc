plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.nucleoid.xyz/' }
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods { "homelander" { sourceSet sourceSets.main } }
}

configurations {
    smokeTestMods
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "eu.pb4:polymer-core:${project.polymer_version}"

    // Resolve the server-side runtime mods directly from their Maven repositories for
    // the disposable smoke-test container. Keep this separate from Minecraft/Loader.
    smokeTestMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    smokeTestMods "eu.pb4:polymer-core:${project.polymer_version}"
}

tasks.register('stageSmokeTestMods', Sync) {
    from configurations.smokeTestMods
    into layout.projectDirectory.dir('server/mods')
    include '*.jar'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
