name: Build, test and publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelander-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Determine build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${BASE_VERSION}+build.${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build mod
        env:
          MOD_VERSION: ${{ steps.version.outputs.version }}
        run: bash ./gradlew --no-daemon test build "-Pmod_version=$MOD_VERSION"

      - name: Prepare stable release assets
        run: python3 scripts/prepare_release.py

      - name: Stage the tested mod in the server image
        run: |
          bash ./gradlew --no-daemon stageSmokeTestMods
          install -D -m 0644 release-assets/homelander-powers.jar server/mods/homelander-powers.jar

      - uses: docker/setup-buildx-action@v4

      - name: Build test server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: homelander-powers:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Minecraft container
        run: bash scripts/container-smoke-test.sh homelander-powers:ci

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: homelander-container-diagnostics
          path: build/container-check/
          if-no-files-found: ignore
          retention-days: 14

      - name: Export tested container
        run: docker save homelander-powers:ci | gzip -1 > build/homelander-powers-container.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: homelander-tested-container
          path: build/homelander-powers-container.tar.gz
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: homelander-release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build-and-test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: homelander-release-assets
          path: release-assets

      - uses: actions/download-artifact@v7
        with:
          name: homelander-tested-container
          path: container

      - name: Check that this is still the current default-branch commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$BRANCH_SHA" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer commit is on the default branch; publication skipped.'
          fi

      - name: Restore the exact tested container image
        if: steps.head.outputs.current == 'true'
        run: gunzip -c container/homelander-powers-container.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image to GHCR
        if: steps.head.outputs.current == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/homelander-powers"
          BUILD_TAG="build-${RUN_ID}-${SHORT_SHA:0:7}"
          docker tag homelander-powers:ci "$IMAGE:dev-latest"
          docker tag homelander-powers:ci "$IMAGE:$BUILD_TAG"
          docker push "$IMAGE:dev-latest"
          docker push "$IMAGE:$BUILD_TAG"

      - name: Publish GitHub Release with stable JAR names
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOD_VERSION: ${{ needs.build-and-test.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_ID}-${GITHUB_SHA:0:7}"
          python3 - <<'PY'
          import os
          from pathlib import Path
          base = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          text = (
              f"Автоматическая сборка **{os.environ['MOD_VERSION']}** для Minecraft Java 1.21.1.\n\n"
              f"Коммит: `{os.environ['GITHUB_SHA']}`.\n\n"
              "На сервере нужны Fabric, Fabric API и Polymer Core. Клиентский мод не требуется.\n\n"
              f"Постоянная ссылка на JAR: {base}/releases/latest/download/homelander-powers.jar\n"
          )
          Path('release-notes.md').write_text(text, encoding='utf-8')
          PY
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [[ "$(python3 -c 'import json; print(json.load(open("existing-release.json"))["isDraft"])')" == 'False' ]]; then
              echo 'This run already has a published release.'
              exit 0
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --draft \
              --target "$GITHUB_SHA" --title "Homelander Powers $MOD_VERSION" \
              --notes-file release-notes.md
          fi
          gh release edit "$TAG" --draft=false --latest \
            --title "Homelander Powers $MOD_VERSION" --notes-file release-notes.md
          echo '### Скачать последнюю сборку' >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/homelander-powers.jar" >> "$GITHUB_STEP_SUMMARY"
