services:
  minecraft:
    build: .
    image: homelander-powers:local
    restart: unless-stopped
    ports:
      - '${MC_BIND:-127.0.0.1}:${MC_PORT:-25565}:25565'
    environment:
      EULA: '${EULA:-TRUE}'
      ONLINE_MODE: '${ONLINE_MODE:-FALSE}'
      MEMORY: '${MEMORY:-2G}'
      MAX_PLAYERS: '${MAX_PLAYERS:-8}'
      VIEW_DISTANCE: '${VIEW_DISTANCE:-6}'
      SIMULATION_DISTANCE: '${SIMULATION_DISTANCE:-4}'
    volumes:
      - homelander-data:/data
volumes:
  homelander-data:
